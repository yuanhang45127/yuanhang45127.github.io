name: Deploy (GitHub Pages + 47 服务器)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # 双端部署其一：GitHub Pages（需要先在仓库 Settings → Pages 选 GitHub Actions）
  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # 双端部署其二：47 服务器 nginx（secrets 见 README）
  deploy-server:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: 加载部署密钥（自动清理 \r + 格式校验）
        run: |
          printf '%s\n' "${{ secrets.SERVER_SSH_KEY }}" | tr -d '\r' > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          ssh-keygen -y -f "$HOME/.ssh/deploy_key" >/dev/null 2>&1 || {
            echo "❌ SERVER_SSH_KEY 格式无效：请从 HANDOFF.md 附录 A 完整复制 8 行（-----BEGIN 到 -----END，含首尾行），重新粘贴该 secret。"
            exit 1
          }
          eval "$(ssh-agent -s)"
          ssh-add "$HOME/.ssh/deploy_key"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "✅ 密钥加载成功：$(ssh-add -l | awk '{print $2, $3}')"
      - name: Trust host key
        run: ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts
      - name: Rsync dist/ to server
        run: |
          rsync -az --delete -e ssh dist/ \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.SERVER_PATH }}/"
